name: brand-safety

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate skills (frontmatter, koka-first block, brand safety)
        run: node scripts/validate-brand-safety.mjs
      - name: Content tests (frontmatter, koka-first, internal links, data accuracy)
        run: node tests/run.mjs
